<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Leitor PIE - UTE Maués</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; } header { background: #172033; color: white; padding: 18px; } header h1 { margin: 0; font-size: 22px; } header p { margin: 6px 0 0; opacity: .8; font-size: 13px; } .container { max-width: 1200px; margin: auto; padding: 18px; } .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); } .buttons { display: flex; gap: 10px; flex-wrap: wrap; } button { border: 0; border-radius: 8px; padding: 12px 16px; cursor: pointer; font-weight: bold; } .btn-primary { background: #1769e0; color: white; } .btn-success { background: #16803c; color: white; } .btn-secondary { background: #64748b; color: white; } button:hover { opacity: .9; } .status { margin-top: 12px; padding: 10px; border-radius: 8px; background: #eef2f7; font-size: 14px; } textarea { width: 100%; min-height: 400px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; font-family: Arial, sans-serif; line-height: 1.5; } table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; } th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; } th { background: #e2e8f0; } .badge { display: inline-block; padding: 4px 7px; border-radius: 6px; font-size: 11px; font-weight: bold; } .disponivel { background: #dcfce7; color: #166534; } .operando { background: #dbeafe; color: #1e40af; } .restricao { background: #fef3c7; color: #92400e; } .manutencao { background: #fed7aa; color: #9a3412; } .indisponivel { background: #fee2e2; color: #991b1b; } .semstatus { background: #e2e8f0; color: #475569; } .empty { text-align: center; padding: 30px; color: #64748b; } .small { font-size: 12px; color: #64748b; } </style> </head> <body> <header> <h1>⚡ LEITOR PIE — UTE MAUÉS</h1> <p>Leitura automática dos dados disponíveis na página do PIE</p> </header> <div class="container"> <div class="card"> <h2>⚡ Controle</h2> <div class="buttons"> <button class="btn-primary" onclick="lerPIE()"> 🔄 LER PIE </button> <button class="btn-success" onclick="gerarRelatorio()"> 📊 GERAR RELATÓRIO </button> <button class="btn-secondary" onclick="copiarWhatsApp()"> 📋 COPIAR WHATSAPP </button> <button class="btn-secondary" onclick="limparTudo()"> 🗑️ LIMPAR </button> </div> <div id="status" class="status"> Aguardando leitura do PIE... </div> </div> <div class="card"> <h2>📋 Dados encontrados</h2> <div id="contador" class="small"> Nenhuma UGD encontrada. </div> <div style="overflow-x:auto;"> <table> <thead> <tr> <th>UGD</th> <th>Equipamento</th> <th>Status</th> <th>HRM</th> <th>OS</th> <th>Descrição</th> </tr> </thead> <tbody id="tabela"> <tr> <td colspan="6" class="empty"> Clique em "LER PIE". </td> </tr> </tbody> </table> </div> </div> <div class="card"> <h2>📱 Relatório WhatsApp</h2> <textarea id="relatorio" placeholder="O relatório aparecerá aqui..."></textarea> </div> </div> <script> let dados = []; /* ========================================================== STATUS ========================================================== */ function atualizarStatus(texto) { document.getElementById("status").textContent = texto; } /* ========================================================== NORMALIZAÇÃO ========================================================== */ function normalizar(texto) { return String(texto || "") .replace(/\u00a0/g, " ") .replace(/\s+/g, " ") .trim(); } /* ========================================================== LIMPA HRM Exemplos: 22.438 + 12 22.438 (+12) 22438 + 12 ========================================================== */ function limparHRM(valor) { if (!valor) return ""; let texto = String(valor); texto = texto .replace(/\([^)]*\)/g, "") .replace(/\+\s*[\d.,]+/g, "") .replace(/\s+/g, " ") .trim(); /* Mantém somente o primeiro número encontrado. */ const encontrado = texto.match(/\d[\d.,]*/); if (!encontrado) return ""; return encontrado[0]; } /* ========================================================== NORMALIZA STATUS ========================================================== */ function normalizarStatus(status) { let s = normalizar(status).toUpperCase(); if ( s.includes("INDISPON") || s === "DI" ) { return "INDISPONÍVEL"; } if ( s.includes("RESTRI") ) { return "OPERANDO COM RESTRIÇÃO"; } if ( s.includes("MANUTEN") ) { return "MANUTENÇÃO"; } if ( s.includes("DISPON") || s === "D" ) { return "DISPONÍVEL"; } if ( s.includes("OPERANDO") || s === "OP" ) { return "OPERANDO"; } if ( s === "OR" ) { return "OPERANDO COM RESTRIÇÃO"; } return s || "NÃO INFORMADO"; } /* ========================================================== CLASSE DO STATUS ========================================================== */ function classeStatus(status) { const s = status.toUpperCase(); if (s.includes("INDISPON")) return "indisponivel"; if (s.includes("MANUTEN")) return "manutencao"; if (s.includes("RESTRI")) return "restricao"; if (s.includes("OPERANDO")) return "operando"; if (s.includes("DISPON")) return "disponivel"; return "semstatus"; } /* ========================================================== DETECTA UGD ========================================================== */ function detectarUGD(texto) { const t = normalizar(texto).toUpperCase(); let m = t.match(/\bUGD[\s\-]*0*(\d{1,2})\b/); if (m) { const numero = parseInt(m[1], 10); if (numero >= 1 && numero <= 60) { return "UGD-" + String(numero).padStart(2, "0"); } } return ""; } /* ========================================================== DETECTA EQUIPAMENTO ========================================================== */ function detectarEquipamento(texto) { const t = normalizar(texto).toUpperCase(); const padroes = [ /UTE\d{3}-[\w\-]+/i, /DIY-[A-Z0-9]+\s*\d+/i ]; for (const regex of padroes) { const m = t.match(regex); if (m) { return m[0]; } } return ""; } /* ========================================================== DETECTA HRM ========================================================== */ function detectarHRM(texto) { const t = normalizar(texto); /* Procura números próximos de palavras relacionadas ao horímetro. */ const padroes = [ /HRM[\s:\-]*([0-9.,]+\s*(?:\+\s*[0-9.,]+)?)/i, /HOR[IÍ]METRO[\s:\-]*([0-9.,]+\s*(?:\+\s*[0-9.,]+)?)/i, /H[\s:\-]*([0-9]{3,}[.,]?[0-9]*)/i ]; for (const regex of padroes) { const m = t.match(regex); if (m) { return limparHRM(m[1]); } } return ""; } /* ========================================================== DETECTA OS ========================================================== */ function detectarOS(texto) { const t = normalizar(texto); const m = t.match(/\bOS[\s:\-]*(\d{5,8})\b/i); return m ? m[1] : ""; } /* ========================================================== DESCRIÇÃO ========================================================== */ function detectarDescricao(texto) { const t = normalizar(texto); const m = t.match( /(?:OS[\s:\-]*\d{5,8})\s*[-–—:]?\s*(.+)$/i ); if (m) { return normalizar(m[1]); } return ""; } /* ========================================================== TENTA LER LINHAS DA PÁGINA ========================================================== */ function lerElementosDaPagina() { const encontrados = []; const elementos = document.querySelectorAll( "tr, [role='row'], .ui-grid-row, .slick-row, div" ); for (const elemento of elementos) { const texto = normalizar(elemento.innerText); if (!texto) continue; const ugd = detectarUGD(texto); if (!ugd) continue; encontrados.push({ texto, elemento }); } return encontrados; } /* ========================================================== PROCESSA LINHAS ========================================================== */ function processarDados() { const linhas = lerElementosDaPagina(); const mapa = {}; for (const item of linhas) { const texto = item.texto; const ugd = detectarUGD(texto); if (!ugd) continue; const equipamento = detectarEquipamento(texto); const hrm = detectarHRM(texto); const os = detectarOS(texto); let status = ""; const upper = texto.toUpperCase(); if (upper.includes("INDISPONÍVEL") || upper.includes("INDISPONIVEL")) { status = "INDISPONÍVEL"; } else if ( upper.includes("MANUTENÇÃO") || upper.includes("MANUTENCAO") ) { status = "MANUTENÇÃO"; } else if ( upper.includes("RESTRIÇÃO") || upper.includes("RESTRICAO") ) { status = "OPERANDO COM RESTRIÇÃO"; } else if ( upper.includes("OPERANDO") ) { status = "OPERANDO"; } else if ( upper.includes("DISPONÍVEL") || upper.includes("DISPONIVEL") ) { status = "DISPONÍVEL"; } const descricao = detectarDescricao(texto); /* Se já encontramos essa UGD, vamos juntar somente informações que ainda não existam. */ if (!mapa[ugd]) { mapa[ugd] = { ugd, equipamento, status, hrm, os, descricao }; } else { const atual = mapa[ugd]; if (!atual.equipamento && equipamento) atual.equipamento = equipamento; if (!atual.hrm && hrm) atual.hrm = hrm; if (!atual.os && os) atual.os = os; if (!atual.descricao && descricao) atual.descricao = descricao; if ( (!atual.status || atual.status === "NÃO INFORMADO") && status ) { atual.status = status; } } } dados = Object.values(mapa); dados.sort((a, b) => { const na = parseInt(a.ugd.replace(/\D/g, ""), 10); const nb = parseInt(b.ugd.replace(/\D/g, ""), 10); return na - nb; }); } /* ========================================================== MOSTRA TABELA ========================================================== */ function mostrarTabela() { const tbody = document.getElementById("tabela"); const contador = document.getElementById("contador"); tbody.innerHTML = ""; if (!dados.length) { tbody.innerHTML = ` <tr> <td colspan="6" class="empty"> Nenhuma UGD encontrada na página. </td> </tr> `; contador.textContent = "Nenhuma UGD encontrada."; return; } contador.textContent = `${dados.length} UGD(s) encontrada(s).`; for (const item of dados) { const tr = document.createElement("tr"); const classe = classeStatus(item.status); tr.innerHTML = ` <td><strong>${escapeHTML(item.ugd)}</strong></td> <td> ${escapeHTML(item.equipamento || "-")} </td> <td> <span class="badge ${classe}"> ${escapeHTML( item.status || "NÃO INFORMADO" )} </span> </td> <td> ${escapeHTML(item.hrm || "-")} </td> <td> ${item.os ? "OS " + escapeHTML(item.os) : "-" } </td> <td> ${escapeHTML(item.descricao || "-")} </td> `; tbody.appendChild(tr); } } /* ========================================================== ESCAPE HTML ========================================================== */ function escapeHTML(valor) { return String(valor || "") .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } /* ========================================================== LER PIE ========================================================== */ function lerPIE() { atualizarStatus( "🔄 Lendo os dados disponíveis na página..." ); try { processarDados(); mostrarTabela(); if (dados.length) { atualizarStatus( `✅ Leitura concluída. ${dados.length} UGD(s) identificada(s).` ); } else { atualizarStatus( "⚠️ Nenhuma UGD foi encontrada na página atual." ); } } catch (erro) { console.error(erro); atualizarStatus( "❌ Erro ao ler a página." ); } } /* ========================================================== RELATÓRIO WHATSAPP ========================================================== */ function gerarRelatorio() { if (!dados.length) { lerPIE(); if (!dados.length) { alert( "Nenhuma UGD foi encontrada." ); return; } } const hoje = new Date().toLocaleDateString( "pt-BR" ); let texto = ""; texto += "*UTE MAUÉS*\n\n"; texto += `*DATA*: _${hoje}_\n\n`; texto += "*STATUS DE DISPONIBILIDADE, HORÍMETRO E HORAS DE OPERAÇÃO DAS UGDs*\n\n"; for (const item of dados) { let emoji = "⚪"; const status = (item.status || "").toUpperCase(); if (status.includes("DISPONÍVEL")) emoji = "🟢"; else if (status.includes("OPERANDO")) emoji = "🔵"; else if (status.includes("RESTRIÇÃO")) emoji = "🟡"; else if (status.includes("MANUTENÇÃO")) emoji = "🟠"; else if (status.includes("INDISPONÍVEL")) emoji = "🔴"; texto += `${emoji} *${item.ugd}*`; if (item.equipamento) { texto += ` ${item.equipamento}`; } texto += "\n"; texto += `${item.status || "NÃO INFORMADO"}\n`; if (item.hrm) { texto += `HRM: ${item.hrm}\n`; } if (item.os) { texto += `OS ${item.os}`; if (item.descricao) { texto += ` – ${item.descricao}`; } texto += "\n"; } texto += "\n"; } document.getElementById( "relatorio" ).value = texto.trim(); atualizarStatus( "✅ Relatório gerado." ); } /* ========================================================== COPIAR WHATSAPP ========================================================== */ async function copiarWhatsApp() { const campo = document.getElementById("relatorio"); if (!campo.value.trim()) { gerarRelatorio(); } try { await navigator.clipboard.writeText( campo.value ); atualizarStatus( "✅ Relatório copiado. Agora é só colar no WhatsApp." ); } catch (erro) { campo.select(); document.execCommand("copy"); atualizarStatus( "✅ Relatório copiado." ); } } /* ========================================================== LIMPAR ========================================================== */ function limparTudo() { dados = []; document.getElementById( "tabela" ).innerHTML = ` <tr> <td colspan="6" class="empty"> Clique em "LER PIE". </td> </tr> `; document.getElementById( "contador" ).textContent = "Nenhuma UGD encontrada."; document.getElementById( "relatorio" ).value = ""; atualizarStatus( "Aguardando leitura do PIE..." ); } </script> </body> </html>
