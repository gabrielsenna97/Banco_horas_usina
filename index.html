function renderList(){list.innerHTML='';sections.forEach((s,i)=>{const d=document.createElement('div');d.className='item'+(active===i?' active':'');d.innerHTML=`<img class=thumb src="thumbs/p${s.page}.jpg" loading=lazy><div><div class=code>${s.code}</div><div class=title>${s.title}</div></div>`;d.onclick=()=>select(i);list.appendChild(d)})}
function select(i){active=i;const s=sections[i];page=s.page;renderList();openPage(page);cur.innerHTML=`<b>${s.code} • ${s.title}</b><small>Páginas ${s.page}–${s.end} do catálogo original</small>`;document.querySelector('aside').classList.remove('open')}
function openPage(p){page=Math.max(1,Math.min(160,p));document.getElementById('gallery').style.display='none';frame.style.display='block';frame.src=`catalogo_scania_dc13.pdf#page=${page}&zoom=page-fit`;}
function openMode(m){if(active===null)return;openPage(m==='drawing'?sections[active].page:sections[active].table)}
function prevPage(){openPage(page-1)} function nextPage(){openPage(page+1)}
const input=document.getElementById('search'), results=document.getElementById('results');
input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();if(q.length<2){results.style.display='none';return};const found=pages.filter(x=>x.text.toLowerCase().includes(q)).slice(0,30);results.innerHTML=`<div class=count>${found.length} resultado(s) exibido(s)</div>`+found.map(x=>{let t=x.text;let idx=t.toLowerCase().indexOf(q);let sn=t.slice(Math.max(0,idx-100),Math.min(t.length,idx+220));return `<div class=res data-p="${x.page}"><small>Página ${x.page}</small><div class=snippet>${escapeHtml(sn)}</div></div>`}).join('');results.querySelectorAll('.res').forEach(r=>r.onclick=()=>{openPage(+r.dataset.p);results.style.display='none'});results.style.display='block'});
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.style.display='none'});
function renderGallery(){const g=document.getElementById('gallery');g.innerHTML=`<div class=welcome><h2>Catálogo Visual Scania DC13</h2><p>Clique na imagem do conjunto para abrir o desenho explodido. Use a busca acima para localizar uma peça ou código.</p></div>`+sections.map((s,i)=>`<div class=card onclick="select(${i})"><img src="thumbs/p${s.page}.jpg" loading=lazy><div class=pad><div class=cc>${s.code}</div><div class=ct>${s.title}</div></div></div>`).join('')}
function showGallery(){frame.style.display='none';const g=document.getElementById('gallery');g.style.display='grid';cur.innerHTML='<b>Galeria de conjuntos</b><small>Escolha visualmente a parte do motor que deseja consultar.</small>';document.querySelector('aside').classList.remove('open')}
renderList();renderGallery();showGallery();
</script></body></html>
