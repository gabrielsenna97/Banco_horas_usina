<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UTE Maués - Capturador PIE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f3f5;

            color: #222;
        }

        .topo {

            background: #1f2937;

            color: white;

            padding: 18px;

            text-align: center;
        }

        .topo h1 {

            margin: 0;

            font-size: 22px;
        }

        .topo p {

            margin:
                6px 0 0;

            opacity: .8;

            font-size: 13px;
        }

        .container {

            width: 95%;

            max-width: 1200px;

            margin: 20px auto;
        }

        .card {

            background: white;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 15px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.08);
        }

        .botoes {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 15px;
        }

        button {

            border: none;

            border-radius: 7px;

            padding:
                11px 16px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        .btn-principal {

            background: #168b45;

            color: white;
        }

        .btn-secundario {

            background: #e5e7eb;

            color: #222;
        }

        .btn-perigo {

            background: #dc3545;

            color: white;
        }

        .btn-whatsapp {

            background: #25d366;

            color: white;
        }

        button:hover {

            opacity: .9;
        }

        .status {

            padding: 12px;

            border-radius: 7px;

            background: #eef7ee;

            border:
                1px solid #cde5cd;

            margin-bottom: 15px;

            font-weight: bold;
        }

        .contador {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(160px, 1fr)
                );

            gap: 10px;
        }

        .contador-item {

            background: #f8f9fa;

            border:
                1px solid #ddd;

            border-radius: 8px;

            padding: 15px;

            text-align: center;
        }

        .contador-item strong {

            display: block;

            font-size: 28px;

            margin-top: 5px;
        }

        table {

            width: 100%;

            border-collapse:
                collapse;
        }

        th,
        td {

            padding: 9px;

            border-bottom:
                1px solid #ddd;

            text-align: left;

            font-size: 13px;
        }

        th {

            background: #f3f4f6;

            position: sticky;

            top: 0;
        }

        .tabela {

            overflow-x: auto;

            max-height: 500px;

            overflow-y: auto;
        }

        textarea {

            width: 100%;

            min-height: 350px;

            resize: vertical;

            padding: 12px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            font-family: Arial;

            font-size: 14px;

            line-height: 1.45;
        }

        .campo {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 10px;

            margin-bottom: 15px;
        }

        .campo label {

            display: block;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 4px;
        }

        .campo input,
        .campo select {

            width: 100%;

            padding: 9px;

            border:
                1px solid #ccc;

            border-radius: 6px;
        }

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.55);

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .modal-conteudo {

            background: white;

            width: 95%;

            max-width: 1000px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 10px;

            padding: 20px;
        }

        .modal-topo {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 15px;
        }

        .modal-topo h2 {

            margin: 0;
        }

        .fechar {

            background: #eee;

            font-size: 20px;

            padding: 6px 12px;
        }

        .vazio {

            text-align: center;

            padding: 30px;

            color: #777;
        }

        @media(max-width:600px) {

            .container {

                width: 98%;
            }

            button {

                width: 100%;
            }

            .botoes {

                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="topo">

        <h1>
            UTE MAUÉS
        </h1>

        <p>
            Capturador e Gerador de Relatório do PIE
        </p>

    </header>


    <main class="container">


        <!-- =================================================
             CONTROLE
        ================================================== -->

        <section class="card">

            <h2>
                Controle da Captura
            </h2>

            <div
                id="status"
                class="status"
            >
                🟢 Sistema pronto.
            </div>

            <div class="botoes">

                <button
                    class="btn-principal"
                    onclick="capturarAtual()"
                >
                    📥 CAPTURAR REGISTRO ATUAL
                </button>

                <button
                    class="btn-secundario"
                    onclick="limparTudo()"
                >
                    🗑 LIMPAR CAPTURAS
                </button>

                <button
                    class="btn-secundario"
                    onclick="exportarJSON()"
                >
                    💾 EXPORTAR DADOS
                </button>

                <button
                    class="btn-secundario"
                    onclick="importarJSON()"
                >
                    📂 IMPORTAR DADOS
                </button>

            </div>

        </section>


        <!-- =================================================
             CONTADORES
        ================================================== -->

        <section class="card">

            <h2>
                Resumo
            </h2>

            <div class="contador">

                <div
                    class="contador-item"
                >

                    UGDs Capturadas

                    <strong
                        id="totalUGD"
                    >
                        0
                    </strong>

                </div>


                <div
                    class="contador-item"
                >

                    Disponíveis

                    <strong
                        id="totalDisponiveis"
                    >
                        0
                    </strong>

                </div>


                <div
                    class="contador-item"
                >

                    Operando

                    <strong
                        id="totalOperando"
                    >
                        0
                    </strong>

                </div>


                <div
                    class="contador-item"
                >

                    Restrição

                    <strong
                        id="totalRestricao"
                    >
                        0
                    </strong>

                </div>


                <div
                    class="contador-item"
                >

                    Manutenção

                    <strong
                        id="totalManutencao"
                    >
                        0
                    </strong>

                </div>


                <div
                    class="contador-item"
                >

                    Indisponíveis

                    <strong
                        id="totalIndisponivel"
                    >
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- =================================================
             TABELA
        ================================================== -->

        <section class="card">

            <h2>
                Registros Capturados
            </h2>

            <div class="tabela">

                <table>

                    <thead>

                        <tr>

                            <th>
                                UGD
                            </th>

                            <th>
                                Equipamento
                            </th>

                            <th>
                                HRM
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                OS
                            </th>

                            <th>
                                Causa
                            </th>

                            <th>
                                Ação
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="tabelaRegistros"
                    >

                    </tbody>

                </table>

            </div>

        </section>


        <!-- =================================================
             RELATÓRIO
        ================================================== -->

        <section class="card">

            <h2>
                Relatório para WhatsApp
            </h2>

            <div class="botoes">

                <button
                    class="btn-principal"
                    onclick="gerarRelatorio()"
                >
                    📊 GERAR RELATÓRIO
                </button>

                <button
                    class="btn-whatsapp"
                    onclick="copiarWhatsApp()"
                >
                    📋 COPIAR PARA WHATSAPP
                </button>

            </div>

            <textarea
                id="relatorio"
                placeholder="O relatório será gerado aqui..."
            ></textarea>

        </section>


    </main>


    <!-- =====================================================
         MODAL DE CAPTURA
    ====================================================== -->

    <div
        id="modalCaptura"
        class="modal"
    >

        <div class="modal-conteudo">

            <div class="modal-topo">

                <h2>
                    Capturar UGD
                </h2>

                <button
                    class="fechar"
                    onclick="fecharModal()"
                >
                    ×
                </button>

            </div>


            <div class="campo">

                <div>

                    <label>
                        UGD
                    </label>

                    <input
                        id="campoUGD"
                        placeholder="Ex.: UGD-01"
                    >

                </div>


                <div>

                    <label>
                        Equipamento
                    </label>

                    <input
                        id="campoEquipamento"
                        placeholder="Ex.: UTE550-0024R"
                    >

                </div>


                <div>

                    <label>
                        Data
                    </label>

                    <input
                        id="campoData"
                        type="date"
                    >

                </div>


                <div>

                    <label>
                        HRM
                    </label>

                    <input
                        id="campoHRM"
                        placeholder="Ex.: 22438"
                    >

                </div>


                <div>

                    <label>
                        Status
                    </label>

                    <select
                        id="campoStatus"
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Disponível
                        </option>

                        <option>
                            Operando
                        </option>

                        <option>
                            Operando com restrição
                        </option>

                        <option>
                            Manutenção mecânica
                        </option>

                        <option>
                            Manutenção elétrica
                        </option>

                        <option>
                            Indisponível
                        </option>

                        <option>
                            Substituição
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Número da OS
                    </label>

                    <input
                        id="campoOS"
                        placeholder="Ex.: 272206"
                    >

                </div>

            </div>


            <div class="campo">

                <div>

                    <label>
                        Causa
                    </label>

                    <input
                        id="campoCausa"
                        placeholder="Causa da ocorrência"
                    >

                </div>


                <div>

                    <label>
                        Ocorrências
                    </label>

                    <input
                        id="campoOcorrencias"
                        placeholder="Ocorrências"
                    >

                </div>


                <div>

                    <label>
                        Ação
                    </label>

                    <input
                        id="campoAcao"
                        placeholder="Ação realizada"
                    >

                </div>


                <div>

                    <label>
                        Previsão de retorno
                    </label>

                    <input
                        id="campoPrevisao"
                        placeholder="Previsão"
                    >

                </div>

            </div>


            <div class="botoes">

                <button
                    class="btn-principal"
                    onclick="salvarCaptura()"
                >
                    💾 SALVAR REGISTRO
                </button>

                <button
                    class="btn-secundario"
                    onclick="fecharModal()"
                >
                    CANCELAR
                </button>

            </div>

        </div>

    </div>


    <script>

        // =====================================================
        // CONFIGURAÇÃO
        // =====================================================

        const STORAGE_KEY =
            "UTE_MAUES_PIE_HTML";

        let registros = [];


        // =====================================================
        // CARREGAR
        // =====================================================

        function carregarDados() {

            try {

                const dados =
                    localStorage.getItem(
                        STORAGE_KEY
                    );

                if (!dados) {

                    registros = [];

                    return;
                }

                registros =
                    JSON.parse(
                        dados
                    );

                if (
                    !Array.isArray(
                        registros
                    )
                ) {

                    registros = [];
                }

            } catch (erro) {

                registros = [];

            }

        }


        // =====================================================
        // SALVAR
        // =====================================================

        function salvarDados() {

            localStorage.setItem(

                STORAGE_KEY,

                JSON.stringify(
                    registros
                )

            );

        }


        // =====================================================
        // STATUS
        // =====================================================

        function mensagem(
            texto
        ) {

            document
                .getElementById(
                    "status"
                )
                .textContent =
                    texto;

        }


        // =====================================================
        // LIMPAR HRM
        // =====================================================

        function limparHRM(
            valor
        ) {

            valor =
                String(
                    valor || ""
                );

            valor =
                valor.replace(
                    /\s*\+\s*[\d.,]+/g,
                    ""
                );

            valor =
                valor.replace(
                    /\(\s*\+\s*[\d.,]+\s*\)/g,
                    ""
                );

            return valor.trim();

        }


        // =====================================================
        // CAPTURAR ATUAL
        // =====================================================

        function capturarAtual() {

            document
                .getElementById(
                    "campoUGD"
                )
                .value = "";

            document
                .getElementById(
                    "campoEquipamento"
                )
                .value = "";

            document
                .getElementById(
                    "campoData"
                )
                .value = "";

            document
                .getElementById(
                    "campoHRM"
                )
                .value = "";

            document
                .getElementById(
                    "campoStatus"
                )
                .value = "";

            document
                .getElementById(
                    "campoOS"
                )
                .value = "";

            document
                .getElementById(
                    "campoCausa"
                )
                .value = "";

            document
                .getElementById(
                    "campoOcorrencias"
                )
                .value = "";

            document
                .getElementById(
                    "campoAcao"
                )
                .value = "";

            document
                .getElementById(
                    "campoPrevisao"
                )
                .value = "";

            document
                .getElementById(
                    "modalCaptura"
                )
                .style.display =
                    "flex";

        }


        // =====================================================
        // SALVAR CAPTURA
        // =====================================================

        function salvarCaptura() {

            const ugd =
                document
                    .getElementById(
                        "campoUGD"
                    )
                    .value
                    .trim();

            const equipamento =
                document
                    .getElementById(
                        "campoEquipamento"
                    )
                    .value
                    .trim();

            if (
                !ugd &&
                !equipamento
            ) {

                alert(
                    "Informe a UGD ou o equipamento."
                );

                return;
            }


            const registro = {

                ugd:
                    ugd,

                equipamento:
                    equipamento,

                data:
                    document
                        .getElementById(
                            "campoData"
                        )
                        .value,

                hrm:
                    limparHRM(
                        document
                            .getElementById(
                                "campoHRM"
                            )
                            .value
                    ),

                status:
                    document
                        .getElementById(
                            "campoStatus"
                        )
                        .value,

                os:
                    document
                        .getElementById(
                            "campoOS"
                        )
                        .value
                        .trim(),

                causa:
                    document
                        .getElementById(
                            "campoCausa"
                        )
                        .value
                        .trim(),

                ocorrencias:
                    document
                        .getElementById(
                            "campoOcorrencias"
                        )
                        .value
                        .trim(),

                acao:
                    document
                        .getElementById(
                            "campoAcao"
                        )
                        .value
                        .trim(),

                previsao:
                    document
                        .getElementById(
                            "campoPrevisao"
                        )
                        .value
                        .trim()

            };


            // =================================================
            // ATUALIZAR SE JÁ EXISTIR
            // =================================================

            const indice =
                registros.findIndex(
                    item =>
                        item.ugd ===
                        registro.ugd
                );


            if (
                indice >= 0
            ) {

                registros[indice] =
                    registro;

            } else {

                registros.push(
                    registro
                );

            }


            // =================================================
            // ORDENAR
            // =================================================

            registros.sort(
                function (
                    a,
                    b
                ) {

                    return (
                        a.ugd || ""
                    ).localeCompare(
                        b.ugd || "",
                        "pt-BR",
                        {
                            numeric: true
                        }
                    );

                }
            );


            salvarDados();

            atualizarTela();

            fecharModal();

            mensagem(
                "✅ Registro salvo com sucesso."
            );

        }


        // =====================================================
        // FECHAR MODAL
        // =====================================================

        function fecharModal() {

            document
                .getElementById(
                    "modalCaptura"
                )
                .style.display =
                    "none";

        }


        // =====================================================
        // ATUALIZAR TELA
        // =====================================================

        function atualizarTela() {

            const tabela =
                document
                    .getElementById(
                        "tabelaRegistros"
                    );

            tabela.innerHTML = "";


            let disponiveis = 0;

            let operando = 0;

            let restricao = 0;

            let manutencao = 0;

            let indisponivel = 0;


            if (
                registros.length === 0
            ) {

                tabela.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="vazio"
                        >
                            Nenhum registro capturado.
                        </td>

                    </tr>

                `;

            }


            registros.forEach(
                function (
                    registro
                ) {

                    const status =
                        (
                            registro.status ||
                            ""
                        ).toUpperCase();


                    if (
                        status.includes(
                            "DISPONÍVEL"
                        )
                    ) {

                        disponiveis++;

                    }


                    if (
                        status ===
                        "OPERANDO"
                    ) {

                        operando++;

                    }


                    if (
                        status.includes(
                            "RESTRI"
                        )
                    ) {

                        restricao++;

                    }


                    if (
                        status.includes(
                            "MANUTEN"
                        )
                    ) {

                        manutencao++;

                    }


                    if (
                        status.includes(
                            "INDISPON"
                        )
                    ) {

                        indisponivel++;

                    }


                    const linha =
                        document
                            .createElement(
                                "tr"
                            );


                    linha.innerHTML = `

                        <td>
                            ${esc(
                                registro.ugd
                            )}
                        </td>

                        <td>
                            ${esc(
                                registro.equipamento
                            )}
                        </td>

                        <td>
                            ${esc(
                                registro.hrm
                            )}
                        </td>

                        <td>
                            ${esc(
                                registro.status
                            )}
                        </td>

                        <td>
                            ${esc(
                                registro.os
                            )}
                        </td>

                        <td>
                            ${esc(
                                registro.causa
                            )}
                        </td>

                        <td>
                            ${esc(
                                registro.acao
                            )}
                        </td>

                    `;


                    tabela.appendChild(
                        linha
                    );

                }
            );


            document
                .getElementById(
                    "totalUGD"
                )
                .textContent =
                    registros.length;


            document
                .getElementById(
                    "totalDisponiveis"
                )
                .textContent =
                    disponiveis;


            document
                .getElementById(
                    "totalOperando"
                )
                .textContent =
                    operando;


            document
                .getElementById(
                    "totalRestricao"
                )
                .textContent =
                    restricao;


            document
                .getElementById(
                    "totalManutencao"
                )
                .textContent =
                    manutencao;


            document
                .getElementById(
                    "totalIndisponivel"
                )
                .textContent =
                    indisponivel;

        }


        // =====================================================
        // ESCAPAR
        // =====================================================

        function esc(
            valor
        ) {

            return String(
                valor || ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        // =====================================================
        // EMOJI
        // =====================================================

        function obterEmoji(
            status
        ) {

            const s =
                String(
                    status || ""
                ).toUpperCase();


            if (
                s.includes(
                    "SUBSTIT"
                )
            ) {

                return "⚫";

            }


            if (
                s.includes(
                    "INDISPON"
                )
            ) {

                return "🔴";

            }


            if (
                s.includes(
                    "MANUTEN"
                )
            ) {

                return "🟠";

            }


            if (
                s.includes(
                    "RESTRI"
                )
            ) {

                return "🟡";

            }


            return "🟢";

        }


        // =====================================================
        // GERAR RELATÓRIO
        // =====================================================

        function gerarRelatorio() {

            if (
                registros.length === 0
            ) {

                alert(
                    "Nenhum registro foi capturado."
                );

                return "";

            }


            let texto = "";


            texto +=
                "*UTE MAUÉS*\n\n";


            texto +=
                "*STATUS DE DISPONIBILIDADE, HORÍMETRO E HORAS DE OPERAÇÃO DAS UGDs*\n\n";


            registros.forEach(
                function (
                    registro
                ) {

                    const emoji =
                        obterEmoji(
                            registro.status
                        );


                    texto +=
                        `${emoji}*${registro.ugd || "UGD"} ${registro.equipamento || ""}*\n`;


                    texto +=
                        `${registro.status || "STATUS NÃO INFORMADO"}\n`;


                    texto +=
                        `HRM- ${registro.hrm || "-"}\n`;


                    if (
                        registro.os
                    ) {

                        texto +=
                            `(OS ${registro.os}) `;

                    }


                    if (
                        registro.causa
                    ) {

                        texto +=
                            `${registro.causa} `;

                    }


                    if (
                        registro.ocorrencias
                    ) {

                        texto +=
                            `${registro.ocorrencias} `;

                    }


                    if (
                        registro.acao
                    ) {

                        texto +=
                            `AÇÃO: ${registro.acao}`;

                    }


                    texto +=
                        "\n\n";

                }
            );


            document
                .getElementById(
                    "relatorio"
                )
                .value =
                    texto;


            mensagem(
                "📊 Relatório gerado."
            );


            return texto;

        }


        // =====================================================
        // COPIAR WHATSAPP
        // =====================================================

        async function copiarWhatsApp() {

            let texto =
                document
                    .getElementById(
                        "relatorio"
                    )
                    .value;


            if (!texto) {

                texto =
                    gerarRelatorio();

            }


            if (!texto) {
                return;
            }


            try {

                await navigator
                    .clipboard
                    .writeText(
                        texto
                    );


                mensagem(
                    "📋 Relatório copiado para o WhatsApp."
                );


            } catch (erro) {

                const area =
                    document.createElement(
                        "textarea"
                    );


                area.value =
                    texto;


                document.body
                    .appendChild(
                        area
                    );


                area.select();


                document.execCommand(
                    "copy"
                );


                area.remove();


                mensagem(
                    "📋 Relatório copiado."
                );

            }

        }


        // =====================================================
        // LIMPAR TUDO
        // =====================================================

        function limparTudo() {

            const confirmar =
                confirm(
                    "Deseja apagar todos os registros capturados?"
                );


            if (!confirmar) {
                return;
            }


            registros = [];


            salvarDados();

            atualizarTela();


            document
                .getElementById(
                    "relatorio"
                )
                .value = "";


            mensagem(
                "🗑 Todas as capturas foram apagadas."
            );

        }


        // =====================================================
        // EXPORTAR JSON
        // =====================================================

        function exportarJSON() {

            if (
                registros.length === 0
            ) {

                alert(
                    "Não existem registros para exportar."
                );

                return;

            }


            const dados =
                JSON.stringify(
                    registros,
                    null,
                    2
                );


            const arquivo =
                new Blob(
                    [
                        dados
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    arquivo
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "UTE_MAUES_PIE.json";


            link.click();


            URL.revokeObjectURL(
                url
            );

        }


        // =====================================================
        // IMPORTAR JSON
        // =====================================================

        function importarJSON() {

            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "file";


            input.accept =
                ".json";


            input.onchange =
                function (
                    evento
                ) {

                    const arquivo =
                        evento.target
                            .files[0];


                    if (!arquivo) {
                        return;
                    }


                    const leitor =
                        new FileReader();


                    leitor.onload =
                        function () {

                            try {

                                const dados =
                                    JSON.parse(
                                        leitor.result
                                    );


                                if (
                                    !Array.isArray(
                                        dados
                                    )
                                ) {

                                    alert(
                                        "Arquivo inválido."
                                    );

                                    return;

                                }


                                registros =
                                    dados;


                                salvarDados();

                                atualizarTela();


                                mensagem(
                                    "📂 Dados importados."
                                );


                            } catch (erro) {

                                alert(
                                    "Não foi possível ler o arquivo."
                                );

                            }

                        };


                    leitor.readAsText(
                        arquivo
                    );

                };


            input.click();

        }


        // =====================================================
        // INICIALIZAÇÃO
        // =====================================================

        carregarDados();

        atualizarTela();

    </script>

</body>

</html>
